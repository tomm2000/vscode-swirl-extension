name: Build and Release VSIX

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set release version from tag
        id: release_info
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const tag = process.env.RELEASE_TAG;
          if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag)) {
            throw new Error('Release tag must have the form vMAJOR.MINOR.PATCH (for example, v0.2.0)');
          }
          const version = tag.slice(1);
          for (const file of ['package.json', 'client/package.json', 'server/package.json']) {
            const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
            manifest.version = version;
            fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\nversion=${version}\n`);
          NODE

      - name: Compile TypeScript
        run: pnpm run compile

      - name: Run test suite
        run: pnpm test

      - name: Build and package VSIX
        run: pnpm run package

      - name: Upload VSIX as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-swirl-${{ steps.release_info.outputs.version }}
          path: "*.vsix"
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Release ${{ steps.release_info.outputs.tag }}
          files: "*.vsix"
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
